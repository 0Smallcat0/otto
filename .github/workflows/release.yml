name: Release

# Run by hand: Actions → Release → Run workflow, or `gh workflow run release.yml`.
# Publishing uses PyPI trusted publishing, so no token is stored anywhere. PyPI
# accepts the upload only after otto-terminal has a publisher (pending, for the
# first release) for owner 0Smallcat0, repository otto, workflow release.yml,
# environment pypi. Bump `version` in pyproject.toml and server.json first:
# PyPI never accepts the same version twice.
on:
  workflow_dispatch:

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install build
          python -m build

      # The wheel is what `uv tool install otto-terminal` will run; without the
      # committed dashboard in it, a user gets an API and no screen.
      - name: Wheel carries the dashboard
        run: python -m zipfile -l dist/*.whl | grep -q "otto/local_terminal/ui/index.html"

      - uses: pypa/gh-action-pypi-publish@release/v1
