[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "otto"
version = "1.0.0"
description = "Clean-room local financial terminal from observed workflow evidence."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "pydantic",
    "PyYAML",
    "uvicorn[standard]",
]

[project.scripts]
otto = "otto.local_terminal.server:main"
otto-mcp = "otto.local_terminal.mcp_server:main"

[project.optional-dependencies]
dev = [
    "httpx",
    "pytest",
    # Pin ruff so CI and local agree: an unpinned ruff let CI pull a newer
    # release (0.16.x) that added ~285 findings across the tree and turned a
    # PowerShell-only commit red (2026-07-24). Bump deliberately, not by drift.
    "ruff==0.15.14",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["otto", "otto.*"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]
exclude = [
    ".git",
    ".venv",
    ".pytest_cache",
    ".ruff_cache",
    "docs/reference",
    "artifacts",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
