[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# Distribution name, not the import name. `otto` and `otto-mcp` were both already
# taken on PyPI by unrelated projects, so publishing under either is impossible
# and `uvx otto-mcp` would fetch a stranger's package. The import package stays
# `otto`; only the wheel is named otto-terminal.
name = "otto-terminal"
version = "1.0.0"
description = "Clean-room local financial terminal from observed workflow evidence."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "pydantic",
    "PyYAML",
    "uvicorn[standard]",
]

[project.scripts]
otto = "otto.local_terminal.server:main"
otto-mcp = "otto.local_terminal.mcp_server:main"
# Same target as otto-mcp, named to match the distribution so `uvx otto-terminal`
# resolves with no --from. Both the README one-liner and the MCP registry entry
# depend on a console script whose name equals the package name; `uvx otto-mcp`
# must never be documented, because that name belongs to an unrelated project.
otto-terminal = "otto.local_terminal.mcp_server:main"

[project.optional-dependencies]
dev = [
    "httpx",
    "pytest",
    # Pin ruff so CI and local agree: an unpinned ruff let CI pull a newer
    # release (0.16.x) that added ~285 findings across the tree and turned a
    # PowerShell-only commit red (2026-07-24). Bump deliberately, not by drift.
    "ruff==0.15.14",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["otto", "otto.*"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]
exclude = [
    ".git",
    ".venv",
    ".pytest_cache",
    ".ruff_cache",
    "docs/reference",
    "artifacts",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
