[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "otto"
version = "1.0.0"
description = "Clean-room local financial terminal from observed workflow evidence."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "pydantic",
    "PyYAML",
    "uvicorn[standard]",
]

[project.scripts]
otto = "otto.local_terminal.server:main"
otto-mcp = "otto.local_terminal.mcp_server:main"

[project.optional-dependencies]
dev = [
    "httpx",
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["otto", "otto.*"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]
exclude = [
    ".git",
    ".venv",
    ".pytest_cache",
    ".ruff_cache",
    "docs/reference",
    "artifacts",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
